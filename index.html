<body>

        <div class="head">
        <h1 id="n">NAME</h1>

    </div>
    <div class="div">
    <span class="line"></span>
    <span class="star"><i class="fa-solid fa-star"></i></span>
    <span class="line"></span>
    </div>
    <div class="con">

    <p class="www">THANK YOU FOR VISITING!</p>
    </div>
    </div>

    <div class="edit">

        <h1><i class="fa-regular fa-pen-to-square"></i> Edit Profile</h1>

        <div class="cc">
        <div class="input-row">
    </i><label for="profile">Change Profile Image:</label>
        <input type="file" id="profile" accept="image/*"><br><br>
        <div class="input-row" >
        <i class="fa-solid fa-user"></i><label for="nn" id="zz">Name:</label>
        <input type="text" placeholder="Enter your name" id="nn"><br><br>
        </div>
        <div class="input-row">
        <i class="fa-solid fa-trophy"></i><label for="dd" id="zz">Designation:</label>

        </div>
        <div class="input-row">
        <i class="fa-regular fa-envelope"></i><label for="mm" id="zz">Email:</label>
        <input type="email" id="mm" placeholder="Enter your email"><br><br>
        </div>
        <div class="input-row"></div>
        <i class="fa-brands fa-instagram"></i><label for="ins" id="zz">Instagram:</label>
        <input id="ins" type="url" placeholder="Enter your Instragram URL"><br><br>
        </div>
        <div class="input-row">
        <i class="fa-brands fa-whatsapp"></i><label for="what" id="zz">WhatsApp:</label>
        <input type="tel" id="what" placeholder="Enter WhatsApp Number"><br><br>
        </div>
        </div>
        <div class="vv">
        <button id="butt">Save Changes</button>
        <button id="download">
    <i class="fa-solid fa-download"></i>
    Download Profile
</button>

<button id="shareImage">
    <i class="fa-solid fa-image"></i>
    Share as Image
</button>

<button id="shareLink">
    <i class="fa-solid fa-link"></i>
    Share Profile Link
</button>




        </div>

    </div>
